name: Widget

# Every action is pinned to a full commit SHA (the tag it came from is in the comment);
# Dependabot (.github/dependabot.yml) proposes updates.

on:
  push:
    branches: ["**"]
    tags: ["widget-v*"]
    paths:
      - "widget/**"
      - "install.ps1"
      - "scripts/ci-install-smoke.ps1"
      - "pyproject.toml"
      - ".github/workflows/widget.yml"
  pull_request:
    paths:
      - "widget/**"
      - "install.ps1"
      - "scripts/ci-install-smoke.ps1"
      - "pyproject.toml"
      - ".github/workflows/widget.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build

  windows:
    name: Windows installer (NSIS)
    needs: web
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: widget/src-tauri
      - name: Install frontend dependencies
        working-directory: widget
        run: npm ci --ignore-scripts
      - name: Cargo flags (--locked once Cargo.lock is committed)
        shell: bash
        run: |
          if [ -f widget/src-tauri/Cargo.lock ]; then
            echo "CARGO_LOCKED=--locked" >> "$GITHUB_ENV"
          else
            echo "CARGO_LOCKED=" >> "$GITHUB_ENV"
          fi
      - name: Rust unit tests
        working-directory: widget
        shell: bash
        # generate_context! needs the built frontend (frontendDist) to exist.
        run: |
          npm run build
          cd src-tauri && cargo test $CARGO_LOCKED
      - name: Build the NSIS installer
        working-directory: widget
        shell: bash
        run: npx --no-install tauri build --bundles nsis -- $CARGO_LOCKED
      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnigroup-windows-nsis
          path: widget/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload Cargo.lock (commit it to pin Rust dependencies)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnigroup-cargo-lock
          path: widget/src-tauri/Cargo.lock
          if-no-files-found: warn

  wheel:
    name: Engine wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build the wheel (the engine, installed without git)
        run: uv build --wheel --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omniscient-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  install-smoke:
    name: install.ps1 + real installer (${{ matrix.profile }} profile, ${{ matrix.shell }})
    needs: [windows, wheel]
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
        # hostile: profile and TEMP with spaces/accents/parentheses, fr-FR, no PYTHONUTF8
        profile: [clean, hostile]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omniscient-wheel
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omnigroup-windows-nsis
          path: dist
      - name: Run install.ps1 with the wheel and the installer built by this run (powershell)
        if: matrix.shell == 'powershell'
        shell: powershell
        env:
          SMOKE_PROFILE: ${{ matrix.profile }}
        run: |
          $wheel = (Get-ChildItem dist\*.whl).FullName
          $setup = (Get-ChildItem dist\*-setup.exe).FullName
          ./scripts/ci-install-smoke.ps1 -Wheel $wheel -Installer $setup -Profile $env:SMOKE_PROFILE
      - name: Run install.ps1 with the wheel and the installer built by this run (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        env:
          SMOKE_PROFILE: ${{ matrix.profile }}
        run: |
          $wheel = (Get-ChildItem dist\*.whl).FullName
          $setup = (Get-ChildItem dist\*-setup.exe).FullName
          ./scripts/ci-install-smoke.ps1 -Wheel $wheel -Installer $setup -Profile $env:SMOKE_PROFILE

  release:
    name: Draft release (widget-v* tags)
    needs: [windows, wheel, install-smoke]
    if: startsWith(github.ref, 'refs/tags/widget-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omnigroup-windows-nsis
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omniscient-wheel
          path: dist
      - name: SHA256SUMS (installer, engine wheel and install.ps1 used by `omniscient update`)
        run: |
          cp install.ps1 dist/install.ps1
          cd dist && sha256sum -- *.exe *.whl install.ps1 > SHA256SUMS && cat SHA256SUMS
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.whl
            dist/install.ps1
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.exe dist/*.whl dist/install.ps1 dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --title "Omnigroup $TAG" \
            --notes "Installeur Windows du widget Omnigroup et moteur Omniscient (roue .whl), publiés ensemble. Installation en une commande : voir le README. Vérification : SHA256SUMS et attestation de provenance (gh attestation verify). Couplage : widget/README.md."
