name: Extension

on:
  push:
    branches: [main]
    paths: ["extension/**", "src/omniscient/group/**", ".github/workflows/extension.yml"]
  pull_request:
    paths: ["extension/**", "src/omniscient/group/**", ".github/workflows/extension.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack the unpacked extension
        run: cd dist && zip -r ../omnigroup-extension.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnigroup-extension
          path: extension/omnigroup-extension.zip
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: End to end (test daemon + test Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install
        run: |
          uv sync --locked
          cd extension && npm ci --ignore-scripts && npm run build
      - name: Test Chromium
        run: uv run --with playwright==1.64.1 python -m playwright install --with-deps chromium
      - name: End to end
        run: uv run --with playwright==1.64.1 python extension/e2e/run.py
