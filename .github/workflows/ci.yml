name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # People install Omniscient on their own PCs: test the oldest supported Python and the
    # newest, so a fresh install works on either.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Test
        run: uv run pytest -q

  windows:
    # The Omnigroup daemon and its hook client run natively on Windows (no WSL).
    runs-on: windows-latest
    env:
      # Test fixtures are written with the default encoding; the engine itself always
      # reads and writes UTF-8 explicitly.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest -q
      - name: Diag (temporary)
        if: always()
        continue-on-error: true
        run: uv run pytest -q -s tests/diag_tmp_e2e.py
