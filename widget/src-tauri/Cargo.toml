[package]
name = "omnigroup"
version = "0.2.0"
description = "Omnigroup: a corner widget showing every running agent of an Omniscient home"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "omnigroup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-notification = "=2.8.1"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
# Launch at Windows login (per-user Run key), switched on once on the first run.
tauri-plugin-autostart = "=2.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Plain HTTP to the loopback daemon only: no TLS, no system proxy.
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream"] }
futures-util = "=0.3.34"
tokio = { version = "=1.54.1", features = ["time"] }
# The widget token lives in the Windows Credential Manager (DPAPI, per Windows user).
keyring = { version = "=3.6.3", features = ["windows-native"] }
# Daemon proof (M5): HMAC-SHA256 keyed by the token's SHA-256, over a random nonce.
sha2 = "=0.11.1"
hmac = "=0.13.0"
getrandom = "=0.4.3"
# JPEG encoder for the optional window screenshot (no dependency; MIT/Apache-2.0 + IJG).
jpeg-encoder = "=0.7.1"
# Reading the browser window the person is on (UI Automation). Already in the lock file
# through tauri: same exact version, so no new crate.
windows = { version = "=0.62.2", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant",
  "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_Security",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
