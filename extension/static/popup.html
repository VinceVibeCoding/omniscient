<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Omnigroup</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <span class="title">Omnigroup</span>
      <span id="link" class="link" role="img" aria-label="Démon"></span>
    </header>

    <section id="pair" class="card" hidden>
      <h2>Coupler l'extension</h2>
      <p>Même code que pour le widget : il s'affiche sur le bureau Windows (2 minutes, 5 essais).</p>
      <label class="field">Adresse du démon <input id="daemon" spellcheck="false" autocomplete="off" /></label>
      <button id="pair-start" type="button">1. Demander un code</button>
      <label class="field">2. Code affiché <input id="pair-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456" /></label>
      <button id="pair-finish" type="button" class="primary">Coupler</button>
    </section>

    <section id="main" class="card" hidden>
      <p id="page" class="page"></p>
      <label class="check"><input type="checkbox" id="attach" /> <span>Joindre cette page à mes questions</span></label>
      <p class="hint">Posez vos questions dans le <strong>widget Omnigroup</strong> (onglet Chat) : il voit cette page et la joint si la case est cochée. Rien ne part vers une IA sans votre question.</p>
    </section>

    <p id="status" class="status" role="status"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
